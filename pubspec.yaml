name: tap_and_dodge
description: "Tap & Dodge — a casual 2D arcade game built with Flutter and Flame."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flame: ^1.38.2
  shared_preferences: ^2.5.6
  audioplayers: ^6.8.1
  google_mobile_ads: ^9.1.0
  connectivity_plus: ^7.3.2
  http: ^1.6.0
  url_launcher: ^6.3.3
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
